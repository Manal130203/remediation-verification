
name: Security verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tools
        run: python -m pip install ruff bandit

      - name: Run regression, adversarial and comparison checks
        shell: pwsh
        run: ./verify.ps1

      - name: Ruff static analysis
        if: always()
        run: ruff check inputs/

      - name: Bandit security analysis
        if: always()
        run: bandit -r inputs/ -f txt -o bandit-report.txt

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-verification-reports
          path: |
            verification-report.txt
            bandit-report.txt
          if-no-files-found: warn
